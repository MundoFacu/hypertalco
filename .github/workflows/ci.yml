name: Local checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Python tests (no host engines or root required)
        run: python3 -m unittest discover -s tests -v
      - name: Syntax
        run: |
          python3 -m compileall -q hypertalco scripts
          bash -n hypertalco-installer.sh install.sh
          node --check hypertalco/static/app.js
          node --input-type=module --check < hypertalco/static/console.js
      - name: Build local release archive
        run: python3 scripts/package_release.py
